services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nexusmarket
      MYSQL_USER: nexusmarket
      MYSQL_PASSWORD: nexusmarket
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 3307 on the host to avoid clashing with a local MySQL service; the app
      # container connects through the compose network (mysql:3306).
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nexusmarket
      SPRING_DATASOURCE_USERNAME: nexusmarket
      SPRING_DATASOURCE_PASSWORD: nexusmarket
      MONGODB_URI: mongodb://mongo:27017/nexusmarket
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  mysql-data:
  mongo-data:
