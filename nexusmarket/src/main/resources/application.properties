# --- Application ---
spring.application.name=nexusmarket
spring.jpa.open-in-view=false

# --- MySQL (transactional domain data) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexusmarket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexusmarket}
spring.jpa.hibernate.ddl-auto=update

# --- MongoDB (audit trail / documental data) ---
# Boot 4: the client URI lives under the spring.mongodb.* prefix (client module).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket}

# --- Security (admin role for /api/reports, HTTP Basic) ---
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD:admin}
spring.security.user.roles=ADMIN
